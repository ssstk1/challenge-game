<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>تحدي — لعبة الأسئلة والصور والأغاني</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="brand"><span class="brand-mark">ت</span><div><b>تحدي</b><small>صور • أغاني • ذكاء</small></div></div>
    <button id="soundToggle" class="icon-btn" aria-label="تشغيل أو إيقاف موسيقى الخلفية">♫</button>
  </header>

  <main>
    <section id="startScreen" class="screen active">
      <div class="welcome">
        <div class="eyebrow">160 فئة جاهزة</div>
        <h1>مو بس أسئلة.<br><span>شوف، اسمع، وخمّن.</span></h1>
        <p>اختار فريقين وادخل تحدي فيه صور حقيقية، معاينات أغاني، مؤثرات، وأسئلة ما تتكرر داخل الجولة.</p>
      </div>
      <div class="glass form-card">
        <label>الفريق الأول<input id="team1" value="الفريق الأول" maxlength="24"></label>
        <label>الفريق الثاني<input id="team2" value="الفريق الثاني" maxlength="24"></label>
        <button id="toCategories" class="primary">اختيار 6 فئات</button>
      </div>
    </section>

    <section id="categoryScreen" class="screen">
      <div class="section-head">
        <div><div class="eyebrow">المرحلة 1</div><h2>اختار 6 فئات</h2></div>
        <div class="counter"><b id="selectedCount">0</b>/6</div>
      </div>
      <div class="tools">
        <input id="categorySearch" type="search" placeholder="ابحث: مصر، راشد الماجد، سيارات...">
        <select id="typeFilter" aria-label="تصفية الفئات">
          <option value="">كل الفئات</option>
          <option value="place">دول ومدن</option>
          <option value="music">فنانون</option>
          <option value="musicmix">أغاني</option>
          <option value="visual">صور ورياضة وترفيه</option>
          <option value="quiz">معلومات</option>
          <option value="puzzle">ألغاز</option>
          <option value="emoji">خمن الكلمة</option>
        </select>
      </div>
      <div id="categoryGrid" class="category-grid"></div>
      <div class="sticky-action"><button id="startGame" class="primary" disabled>ابدأ اللعبة</button></div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="scorebar">
        <div class="team-card"><small id="team1Label"></small><strong id="score1">0</strong></div>
        <div class="round"><span>الجولة</span><b id="progressText">0 / 36</b></div>
        <div class="team-card"><small id="team2Label"></small><strong id="score2">0</strong></div>
      </div>
      <div id="board" class="board"></div>
    </section>

    <section id="finishScreen" class="screen">
      <div class="finish-card glass">
        <div class="trophy">🏆</div>
        <h2 id="winnerTitle">انتهت اللعبة</h2>
        <p id="winnerText"></p>
        <div class="final-scores">
          <div><span id="finalTeam1"></span><b id="finalScore1"></b></div>
          <div><span id="finalTeam2"></span><b id="finalScore2"></b></div>
        </div>
        <button id="restart" class="primary">لعبة جديدة</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="question-card">
      <div class="qtop">
        <span id="qCategory" class="chip"></span>
        <span id="qValue" class="points-chip"></span>
      </div>

      <div id="mediaArea" class="media-area">
        <div id="loader" class="loader"><i></i><span>جاري تجهيز السؤال...</span></div>
        <img id="qImage" alt="" hidden>
        <div id="audioBox" class="audio-box" hidden>
          <div class="vinyl">♪</div>
          <button id="playPreview" class="play-btn">▶ تشغيل المقطع</button>
          <small>معاينة قصيرة عندما تكون متاحة</small>
        </div>
        <div id="emojiBox" class="emoji-box" hidden></div>
      </div>

      <div class="timer-row"><div id="timerBar" class="timer-bar"></div><b id="timer">30</b></div>
      <h3 id="qText">السؤال</h3>
      <div id="answerBox" class="answer-box" hidden></div>

      <div class="qactions">
        <button id="showAnswer" class="secondary">إظهار الإجابة</button>
        <button id="award1" class="award blue">✓ <span id="award1Name"></span></button>
        <button id="award2" class="award red">✓ <span id="award2Name"></span></button>
        <button id="nobody" class="ghost">لا أحد</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
</div>
<script src="categories.js"></script>
<script src="targets.js"></script>
<script src="app-new.js"></script>
</body>
</html>
